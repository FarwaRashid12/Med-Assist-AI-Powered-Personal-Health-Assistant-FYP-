name: medassist
description: "MedAssist - AI-powered medical assistance app for Final Year Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / Fonts
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # Firebase
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  get_it: ^8.0.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  flutter_tts: ^4.2.2
  google_generative_ai: ^0.4.7
  image_picker: ^1.2.1
  http: ^1.6.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0
  file_picker: ^11.0.2
  record: ^6.2.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
